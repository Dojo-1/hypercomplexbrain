[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aionq"
version = "0.1.0"
description = "AION-Omega^Q / QSigma-R: audited almost-all-quantum brain architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
