name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# QSigma-R4-E.  Three platforms, because the `import resource` defect was found
# by a reviewer on Windows and not by anything here. A green Linux job has never
# been evidence about Windows and this file does not let it read as one: each
# platform reports its own test count, and platform-specific skips are printed
# rather than silently absorbed.
#
# No job gates on a wall-clock ratio. The benchmark runs as a smoke test only --
# a loaded runner must not be able to fail a claim about arithmetic.

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install using the real src/ layout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements.txt

      - name: Import the package on this platform
        run: python -c "import aionq, aionq.residency, aionq.evidence, aionq.hb0, aionq.recognition.metrics; print('import ok')"

      - name: Correctness suite
        run: python -m pytest -q -rs --junitxml=artifacts/test-results/pytest.xml

      - name: Verify every committed evidence envelope
        run: python -m aionq.verify_envelopes artifacts

      - name: HB-0 coupled architecture smoke
        run: python experiments/run_hb0_smoke.py

      - name: Benchmark smoke test (not gated on timing)
        run: python experiments/run_instrument_benchmark.py

      - name: Upload raw artifacts and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            artifacts/r4/
            artifacts/test-results/
          if-no-files-found: warn

  # QSigma-R6O. Part B recomputed on each platform, compared in two layers
  # (decision exactly, numbers at 1e-10). Exits zero only on REPRODUCED; the
  # full report is printed as an R6O_REPORT line and uploaded whatever happens.
  # Separate from `test` so an OUTCOME_ONLY platform cannot redden correctness.
  part-b-reproduction:
    name: Part B reproduction · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install using the real src/ layout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements.txt

      - name: Recompute Part B and compare
        run: python experiments/run_part_b_reproduction.py artifacts/test-results/part_b_reproduction-${{ matrix.os }}-py${{ matrix.python }}.json

      - name: Upload the reproduction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-b-reproduction-${{ matrix.os }}-py${{ matrix.python }}
          path: artifacts/test-results/
          if-no-files-found: warn
